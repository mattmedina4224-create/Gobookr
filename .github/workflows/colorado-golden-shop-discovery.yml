name: Colorado Golden List — statewide shop website discovery
on:
  workflow_dispatch:
  schedule:
    - cron: '19 14 * * 1'
  push:
    branches: [main]
    paths:
      - 'scripts/crawl-colorado-golden-shops.js'
      - '.github/workflows/colorado-golden-shop-discovery.yml'
permissions:
  contents: write # only to commit discovery results to the data/colorado-shop-discovery branch
jobs:
  colorado-shops:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify scanner syntax
        run: node --check scripts/crawl-colorado-golden-shops.js
      - name: Fetch DORA shop licenses and OSM storefront websites
        run: node scripts/crawl-colorado-golden-shops.js
      - name: Publish discovery report summary
        if: success()
        run: |
          node -e "const r=require('./tmp/colorado-golden-shop-report.json');console.log(JSON.stringify({licensed_shop_records:r.licensed_active_candidates,open_mapped_places:r.mapped_beauty_places,unique_shop_candidates:r.total_candidates,candidates_with_website:r.with_websites,errors:r.errors},null,2))"
      - name: Save results to the data/colorado-shop-discovery branch
        if: success()
        run: |
          set -e
          mkdir -p /tmp/out && cp tmp/colorado-golden-shop-* /tmp/out/
          git config user.name "gobookr-discovery-bot"
          git config user.email "discovery-bot@users.noreply.github.com"
          git fetch origin data/colorado-shop-discovery || true
          if git rev-parse --verify -q origin/data/colorado-shop-discovery; then git checkout -B data/colorado-shop-discovery origin/data/colorado-shop-discovery; else git checkout --orphan data/colorado-shop-discovery && git rm -rfq . ; fi
          mkdir -p runs/latest runs/$(date -u +%Y-%m-%d)
          cp /tmp/out/* runs/latest/ && cp /tmp/out/colorado-golden-shop-report.json runs/$(date -u +%Y-%m-%d)/
          git add runs && git commit -qm "Colorado shop discovery $(date -u +%Y-%m-%dT%H:%MZ) run ${{ github.run_id }}" && git push origin data/colorado-shop-discovery
      - name: Upload statewide audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colorado-golden-shop-discovery
          path: |
            tmp/colorado-golden-shop-candidates.csv
            tmp/colorado-golden-shop-candidates.json
            tmp/colorado-golden-shop-report.json
          retention-days: 30
          if-no-files-found: warn
